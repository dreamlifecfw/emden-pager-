<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emden Pager</title><link rel="stylesheet" href="style.css"></head><body>
<div id="warning" class="overlay"><div class="box"><h1>رسالة للتوعية</h1><p>هذا الموقع مخصص للعبة داخل ماب <b>Emden</b> في Roblox. يمنع استخدام أو تفسير المصطلحات والرسائل خارج إطار اللعبة. جميع الرسائل والشفرات هنا جزء من تجربة اللعب فقط.</p><button id="agree" disabled>موافق <span id="timer">5</span></button></div></div>
<main id="app" class="hidden"><section class="pager"><div class="top">PAGER</div><div class="screen"><small>الرسائل</small><div id="messages"><div class="empty">لا توجد رسائل</div></div></div><div class="actions"><button id="sendOpen">إرسال رسالة</button><button id="decodeOpen">فك الشفرة</button></div></section></main>
<div id="modal" class="overlay hidden"><div class="box"><button id="close" class="x">×</button><h2 id="title"></h2><div id="codeArea"><p>أدخل الرمز:</p><div id="display" class="display"></div><div id="keys" class="keys"></div><button id="clear">مسح</button></div><div id="sendArea" class="hidden"><textarea id="message" placeholder="اكتب رسالتك بالعربي..."></textarea><button id="send">إرسال</button><div id="cooldown"></div></div><div id="decodeArea" class="hidden"><textarea id="numbers" placeholder="أدخل أرقام البيجر..."></textarea><button id="decode">فك الشفرة</button><div id="result"></div></div></div></div><script src="script.js"></script></body></html>
